ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.gonghak.ApplicationKt.module ]
    }
}

database {
    driver = ${?DB_DRIVER}
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}

gemini {
    apiKey = ${?GEMINI_API_KEY}
    model = ${?GEMINI_MODEL}
}
