ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.gonghak.ApplicationKt.module ]
    }
}

database {
    driver = ${?DB_DRIVER}
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}

gemini {
    apiKey = ${?GEMINI_API_KEY}
    model = ${?GEMINI_MODEL}
}

emailReply {
    domain = ${?EMAIL_REPLY_DOMAIN}
    prefix = ${?EMAIL_REPLY_PREFIX}
    webhookSecret = ${?EMAIL_WEBHOOK_SECRET}
    enforceSenderAuth = ${?EMAIL_ENFORCE_SENDER_AUTH}
}

emailImap {
    enabled = ${?IMAP_ENABLED}
    host = ${?IMAP_HOST}
    port = ${?IMAP_PORT}
    user = ${?IMAP_USER}
    pass = ${?IMAP_PASS}
    folder = ${?IMAP_FOLDER}
    pollIntervalSeconds = ${?IMAP_POLL_INTERVAL_SECONDS}
    smtpHost = ${?SMTP_HOST}
    smtpUser = ${?SMTP_USER}
    smtpPass = ${?SMTP_PASS}
}
